spring.application.name=client-growth-tracker

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/client_growth_tracker
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=client-growth-tracker
app.jwt.expiration-minutes=60

# Initial administrator bootstrap
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN:false}
app.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}